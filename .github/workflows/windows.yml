name: Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "spacecop/**"
      - "packaging/windows/**"
      - "native/**"
      - "pyproject.toml"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "spacecop/**"
      - "packaging/windows/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SpaceCopVPN.exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build the native crypto library (MinGW gcc)
        shell: pwsh
        run: |
          gcc --version | Select-Object -First 1
          ./native/build.ps1
          python -c "from spacecop.crypto import aead; print(aead.backend())"

      # Wintun: the signed Windows TUN driver (wintun.net). Bundled next to the
      # executables so whole-system mode works out of the box.
      - name: Download Wintun
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun-src -Force
          New-Item -ItemType Directory -Force wintun | Out-Null
          Copy-Item wintun-src\wintun\bin\amd64\wintun.dll wintun\wintun.dll
          Copy-Item wintun-src\wintun\LICENSE.txt wintun\WINTUN-LICENSE.txt
          Get-FileHash wintun\wintun.dll

      - name: Whole-system smoke test (Wintun adapter create/close; informational)
        continue-on-error: true
        shell: pwsh
        env:
          SPACECOP_WINTUN: ${{ github.workspace }}\wintun\wintun.dll
        run: |
          python -c "from spacecop.tun.windows import WindowsTun, is_admin; print('admin:', is_admin()); t = WindowsTun(); print('adapter if', t.interface_index(), 'driver', t.driver_version()); t.write_packet(b'\x45' + b'\x00'*19); t.close(); print('wintun OK')"

      - name: Build GUI (SpaceCopVPN.exe) and CLI (spacecop.exe)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SpaceCopVPN `
            --paths . --hidden-import spacecop --collect-submodules spacecop `
            --add-binary "wintun\wintun.dll;." `
            --add-binary "spacecop\crypto\lib\spacecop_crypto.dll;." `
            packaging/windows/spacecop_gui_entry.py
          pyinstaller --noconfirm --clean --onefile --console --name spacecop `
            --paths . --hidden-import spacecop --collect-submodules spacecop `
            --add-binary "wintun\wintun.dll;." `
            --add-binary "spacecop\crypto\lib\spacecop_crypto.dll;." `
            packaging/windows/spacecop_cli_entry.py
          Get-ChildItem dist

      - name: Smoke test the CLI build
        shell: pwsh
        run: |
          .\dist\spacecop.exe --version
          .\dist\spacecop.exe --version | Select-String "native" | ForEach-Object { "crypto backend OK: $_" }
          .\dist\spacecop.exe --help | Select-Object -First 5

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $ref = "$env:GITHUB_REF_NAME" -replace '/', '-'
          Copy-Item dist\SpaceCopVPN.exe out\SpaceCopVPN.exe
          Copy-Item dist\spacecop.exe out\spacecop.exe
          Copy-Item wintun\wintun.dll out\wintun.dll
          Copy-Item wintun\WINTUN-LICENSE.txt out\WINTUN-LICENSE.txt
          Copy-Item spacecop\crypto\lib\spacecop_crypto.dll out\spacecop_crypto.dll
          Copy-Item packaging\windows\README.md out\README.txt
          Compress-Archive -Path out\* -DestinationPath "SpaceCopVPN-windows-$ref.zip" -Force
          Get-ChildItem .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceCopVPN-windows
          path: SpaceCopVPN-windows-*.zip
          retention-days: 30

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SpaceCopVPN-windows-*.zip
            out/SpaceCopVPN.exe
          generate_release_notes: true
