[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spacecopvpn"
version = "0.3.3"
description = "A from-scratch, decentralised, incentivised VPN protocol (stdlib + optional C crypto)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["vpn", "networking", "protocol", "decentralized", "cryptography"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Networking",
    "Topic :: Security :: Cryptography",
]
dependencies = []  # standard library only, by design

[project.scripts]
spacecop = "spacecop.cli:main"
spacecop-gui = "spacecop.gui.app:main"

[project.urls]
Homepage = "https://github.com/stoedwizzard/spacecopvpn"

[tool.setuptools.packages.find]
include = ["spacecop*"]

[tool.setuptools.package-data]
"spacecop.crypto" = ["lib/*"]
